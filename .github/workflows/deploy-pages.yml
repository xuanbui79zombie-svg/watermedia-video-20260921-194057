name: Deploy video site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp index.html .nojekyll movie.mp4 movie-720p.mp4 movie-480p.mp4 _site/
          gh release download movie-14854-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern movie-14854-pages-1080p.mp4 \
            --dir _site
          test -s _site/movie-14854-pages-1080p.mp4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
